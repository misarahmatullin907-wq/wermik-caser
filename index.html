<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WERMIK CASES — Демо-версия</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Sofia+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
:root{--g:#44C987;--c:#83D8FF}
body{font:500 16px 'Sofia Sans',Arial,sans-serif;color:#eef3f6;background:linear-gradient(rgba(18,22,28,.5),rgba(18,22,28,.82)),radial-gradient(900px 520px at 72% 6%,#a09389,#6a6878 55%,#3b3e48) fixed;min-height:100vh}
h1,h2,h3,h4,nav a,.logo,.ban,.ok,.nw,.p,.it small,.cn button,.ms button,.demo,.f b,.c .n{font-family:Oswald,'Arial Narrow',sans-serif}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:#323b41;transition:.2s}
button:hover{filter:brightness(1.3);transform:translateY(-1px)}
input{font:inherit;color:inherit;background:#0004;border:1px solid #fff2;padding:6px 8px;width:80px}
header{position:fixed;inset:0 0 auto;height:68px;z-index:20;display:flex;align-items:center;background:linear-gradient(90deg,#2D3540,#394453 55%,#2D3540);border-bottom:1px solid #0006}
.logo{width:280px;padding-left:24px;font:italic 700 28px Oswald;letter-spacing:1px;white-space:nowrap}
.logo span{color:var(--c)}
nav{flex:1;display:flex;justify-content:center}
nav a{padding:0 34px;font-size:26px;text-transform:uppercase;font-weight:700;border-left:2px solid #fff3;line-height:30px;transition:.2s}
nav a:first-child{border:0}nav a:hover{color:#fff}nav a.on{color:var(--c)}
.bal{display:flex;align-items:center;gap:10px;margin-right:16px;font-size:22px}
.demo{white-space:nowrap;background:#f0a818;color:#111;padding:2px 8px;font-size:13px;font-weight:700;letter-spacing:.5px}
.plus{width:44px;height:56px;background:#00AB5C;font-size:28px}
.av{width:44px;height:44px;border-radius:4px;background:linear-gradient(135deg,#3ec7ff,#2ecc71);display:grid;place-items:center;font-weight:700;font-size:20px;color:#07251a}
aside{position:fixed;top:68px;bottom:0;left:0;width:280px;background:#1e232a8c;z-index:10;display:flex;flex-direction:column;backdrop-filter:blur(14px)}
.ban{height:94px;padding:14px 12px;background:linear-gradient(120deg,#0e3a2c,#b86f1c);font:700 28px/1.05 Oswald;text-transform:uppercase}
.ban span{color:var(--c);display:block}
.tb{display:flex;height:54px;border-bottom:1px solid #0005}.tb button{flex:1;background:#1f272b;font-size:22px}.tb .on{background:#2c5a6a}
#fd{flex:1;overflow:hidden;padding:8px 10px}
.f{display:flex;gap:10px;align-items:center;height:82px;animation:sl .5s both}
.f .im{width:95px;height:64px;flex:none;background:linear-gradient(#586067,#3d444a);border-bottom:4px solid var(--rc);display:grid;place-items:center}
.f svg{width:85%}.f b{display:block;font-size:15px}.f small{opacity:.7;font-size:13px}
.tg{height:50px;display:grid;place-items:center;background:#1c2327;font-size:13px;opacity:.9}
.sr{position:sticky;top:68px;z-index:5;height:52px;display:flex;justify-content:center;align-items:center;background:#2a31358c;backdrop-filter:blur(8px)}
.sr input{width:min(460px,80%);background:none;border:0;border-bottom:1px solid #fff4;font-size:17px;text-transform:uppercase;padding:8px}
main{margin-left:280px;padding-top:68px;padding-bottom:60px}
.w{max-width:1390px;margin:auto;padding:0 16px;animation:fx .45s both}
h2{font:700 34px Oswald;text-transform:uppercase;margin:28px 0 14px}h2 small{font-size:18px;opacity:.6}
.g{display:grid;grid-template-columns:repeat(5,1fr);gap:15px}
.c{position:relative;display:block;background:#0003;transition:.25s;animation:in .5s both}
.c:hover{transform:translateY(-6px);box-shadow:0 14px 30px #0009,0 0 0 1px #3ec7ff99}
.c .im{aspect-ratio:260/186;background:linear-gradient(180deg,#454645,#939393);display:grid;place-items:center;overflow:hidden}
.c .im svg{width:88%;transition:.35s}.c:hover .im svg{transform:scale(1.1) rotate(-2deg)}
.c .in{padding:12px 15px;background:#4a463f99}.c .n{font-weight:700;font-size:16px}
.p{font-size:20px;font-weight:700;display:flex;align-items:center;gap:5px}
.nw{position:absolute;left:0;top:0;background:#2a8fd0;padding:4px 10px;font-weight:700;font-style:normal;z-index:2}
.ch{display:flex;align-items:center;gap:20px;margin-top:22px}.ch h1{font:700 40px Oswald;text-transform:uppercase}.bk{opacity:.7}
.rl{position:relative;overflow:hidden;background:#0005;margin:18px 0;border-block:2px solid #fff2;box-shadow:inset 0 0 60px #000a}
.rl:after{content:'';position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1px;background:#ffd24a;box-shadow:0 0 18px 2px #ffd24a;z-index:2}
.st{display:flex;gap:10px;padding:14px 0;will-change:transform}
.it{flex:none;width:150px;height:175px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;background:radial-gradient(circle at 50% 115%,color-mix(in srgb,var(--rc) 50%,transparent),transparent 65%),linear-gradient(180deg,#454645,#7e7e7e);box-shadow:inset 0 -4px 0 var(--rc)}
.it svg{width:100%}.it small{font-weight:700;font-size:14px}.it i{font-style:normal;opacity:.7;font-size:12px}.it b{display:flex;gap:4px;align-items:center;font-size:14px}
.g2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.g2 .it{width:auto;transition:.25s}.g2 .it:hover{transform:translateY(-5px);box-shadow:inset 0 -4px 0 var(--rc),0 0 22px var(--rc)}
.ctl{display:flex;gap:20px;align-items:center;justify-content:center}
.ok{background:#13432C;border:1px solid #44C987;color:#44C987;box-shadow:inset 0 0 16px #44c98773;padding:14px 34px;font-size:22px;font-weight:700;text-transform:uppercase;display:flex;gap:8px;align-items:center}
.ok:hover{background:#1D5A3A;box-shadow:inset 0 0 16px #44c986a6;filter:none}.ok:disabled{box-shadow:none;border-color:#fff2;color:#fff8;background:#3a4348;opacity:.6;cursor:default}
.iw{display:flex;flex-direction:column;gap:6px}.iw button{padding:7px}
.md{position:fixed;inset:0;background:#000b;z-index:50;display:grid;place-items:center;animation:fx .25s both;padding:14px}
.bx{background:#252d32;padding:26px;max-width:560px;width:100%;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;position:relative;overflow:hidden}
.bx button{padding:11px 26px}
.rs{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}.rs>*{position:relative}
.rays{position:absolute!important;width:520px;height:520px;top:-120px;background:repeating-conic-gradient(color-mix(in srgb,var(--rc) 45%,transparent) 0 10deg,transparent 0 20deg);border-radius:50%;animation:rot 12s linear infinite;mask:radial-gradient(#000,transparent 70%);-webkit-mask:radial-gradient(#000,transparent 70%)}
.rs h3{font-size:30px;color:var(--rc);text-shadow:0 0 18px var(--rc);text-transform:uppercase}
.big{width:220px;height:230px;animation:pop .6s both;box-shadow:inset 0 -5px 0 var(--rc),0 0 50px var(--rc)}
.ug{display:grid;grid-template-columns:1fr 360px 1fr;gap:20px;margin-top:20px}
.pn{background:#2a3135b0;min-width:0}.pn h4{background:#1e2529;padding:16px 20px;font-size:17px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sl{height:380px;display:flex;flex-wrap:wrap;gap:8px;padding:12px;align-content:flex-start;overflow:auto}.sl:empty:before{content:'Выберите ниже';margin:auto;opacity:.4}
.sl .it{width:110px;height:130px}
.wc{display:grid;place-items:center}.wheel{position:relative;width:310px;height:310px;border-radius:50%;box-shadow:0 0 0 8px #151a1d,0 0 40px #0008}
.ptr{position:absolute;inset:0}.ptr i{position:absolute;left:50%;top:-12px;margin-left:-12px;border:12px solid transparent;border-top:22px solid #ffb02e;border-bottom:0}
.ct{position:absolute;inset:48px;border-radius:50%;background:radial-gradient(#2b3338,#14191c);display:grid;place-content:center;text-align:center}.ct b{font-size:38px}
.bar{display:grid;grid-template-columns:1fr 360px 1fr;gap:20px;margin-top:20px;align-items:stretch}
.bar .pn{padding:14px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.bar input[type=range]{width:100%;padding:0}
.ms{display:flex;gap:6px;background:#2a3135b0;padding:10px}.ms button{flex:1;padding:12px 0;font-weight:700}
.ug2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}.g3{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:8px;padding:12px;max-height:420px;overflow:auto}.g3 .it{width:auto;height:140px;cursor:pointer;transition:.2s}.g3 .it:hover{transform:scale(1.04)}.g3 .sel{outline:2px solid var(--g)}
table{width:100%;border-collapse:collapse}td,th{padding:8px;text-align:left;border-bottom:1px solid #fff1}
.em{padding:50px;text-align:center;opacity:.6}
.ts{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111e;padding:12px 20px;z-index:60;animation:fx .3s both;border-left:4px solid var(--c)}
.wm{position:fixed;right:10px;bottom:6px;font:12px/1 Arial,sans-serif;color:#fffc;z-index:99;text-shadow:0 1px 3px #000}.wm:hover{color:#fff;text-decoration:underline}
.ch svg{width:130px;animation:fl 3s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-6px)}}.qs{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}.q{padding:16px;display:flex;justify-content:space-between;align-items:center;gap:14px}.pg{height:8px;background:#0006;margin:8px 0}.pg i{display:block;height:100%;background:var(--g);transition:.4s}.q .ok{padding:10px 18px;font-size:18px;white-space:nowrap}.it img,.f img{width:100%;display:block}.cn{display:flex;gap:6px}.cn button{padding:11px 15px;font-weight:700}.cn .on{background:var(--g);color:#06210f}
.rb{display:flex;gap:10px;width:100%}.rb button{flex:1;padding:14px 8px;font-size:18px;font-weight:700;justify-content:center}.sl2{background:#b8741a;display:flex;gap:6px;align-items:center}.cl{margin-top:14px;background:none!important;border:1px solid #fff3!important;padding:9px 24px!important}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:44vh;overflow:auto;width:100%}.mg .it{width:auto;height:135px}
.m .it{width:105px;height:125px}.m .it i,.m .it b{display:none}.m .rl{margin:8px 0}.m .st{padding:6px 0}
@keyframes in{from{opacity:0;transform:translateY(16px)}}@keyframes fx{from{opacity:0;transform:translateY(8px)}}@keyframes sl{from{opacity:0;transform:translateX(-40px)}}@keyframes rot{to{transform:rotate(360deg)}}@keyframes pop{0%{transform:scale(.3) rotate(-8deg);opacity:0}70%{transform:scale(1.08)}}
@media(max-width:1250px){.g{grid-template-columns:repeat(4,1fr)}nav a{padding:0 18px;font-size:22px}}
@media(max-width:900px){aside{display:none}main{margin:0;padding-bottom:76px}.logo{width:auto;padding-left:12px;font-size:20px}.bal{font-size:16px;margin-left:auto;margin-right:8px;gap:6px}.demo{font-size:10px;padding:2px 5px}.plus{height:40px;width:32px;font-size:22px}.av{width:34px;height:34px}.bal>button:nth-of-type(2){display:none}
nav{position:fixed;bottom:0;left:0;right:0;height:56px;background:#1c2327;z-index:30;border-top:1px solid #fff2}nav a{flex:1;padding:0;text-align:center;font-size:13px;line-height:56px;border:0}
.g{grid-template-columns:repeat(2,1fr);gap:10px}h2{font-size:26px}.c .in{padding:8px 10px}.c .p{font-size:17px}.ch h1{font-size:28px}.ug,.bar,.ug2{grid-template-columns:1fr}.wheel{width:270px;height:270px}.sl{height:200px}.wm{bottom:62px}.ok{padding:12px 20px;font-size:18px}.ms{flex-wrap:wrap}}
@media(max-width:900px){.rl .it{width:112px;height:135px}.m .it{width:90px;height:110px}.mg{grid-template-columns:repeat(2,1fr)}.rb button{font-size:15px}.bx{padding:16px}.big{width:180px!important;height:190px!important}.ctl{flex-wrap:wrap}.upw{display:flex;flex-direction:column;gap:12px;margin-top:14px}.upw .ug,.upw .bar{display:contents}.wc{order:1}#go{order:2;width:100%}.ms{order:3}.pb{order:4}.pa{order:5}.pt{order:6}.ug2{order:7;margin:0}}

/* WERMIK FINAL: crisp cards, restrained neon, responsive polish */
:root{--panel:#202830;--line:rgba(155,208,238,.15);--glow:rgba(85,194,255,.15)}
html{scroll-behavior:smooth}
body{background-color:#141b24;background-image:radial-gradient(ellipse 850px 550px at 77% -10%,rgba(59,133,170,.22),transparent 74%),radial-gradient(ellipse 750px 540px at 10% 60%,rgba(26,104,84,.11),transparent 75%),linear-gradient(135deg,#151a22,#222a33 65%,#161d26)}
header{background:rgba(20,27,36,.95);border-bottom:1px solid var(--line);box-shadow:0 8px 40px #0005;backdrop-filter:blur(16px)}
.logo{letter-spacing:1.3px;text-shadow:0 0 24px #83d8ff24}
nav a{font-size:clamp(17px,1.65vw,24px);transition:color .2s,text-shadow .2s}
nav a.on,nav a:hover{color:#a3e6ff;text-shadow:0 0 18px #83d8ff44}
aside{background:rgba(14,20,27,.77);border-right:1px solid var(--line)}
.sr{background:rgba(26,35,45,.75);border-bottom:1px solid #ffffff0b}
.w{max-width:1480px}.w h2{letter-spacing:.4px}
.c{overflow:hidden;border:1px solid var(--line);border-radius:12px;background:linear-gradient(155deg,#26303a,#1b242c);box-shadow:0 10px 30px #0002;isolation:isolate}
.c:hover{transform:translateY(-5px);border-color:#6dcaff88;box-shadow:0 16px 36px #0007,0 0 28px var(--glow)}
.c .im{background:radial-gradient(ellipse at 50% 85%,rgba(112,187,216,.18),transparent 65%),linear-gradient(160deg,#35414d,#202832);padding:12px}
.c .im svg{filter:drop-shadow(0 12px 9px #0008);max-height:100%}
.c .in{background:linear-gradient(110deg,#252f39,#1d262e);border-top:1px solid #ffffff13}
.c .n{line-height:1.35}.c .p{color:#9ee8c1}
.nw{border-radius:0 0 9px 0;background:#1283bc;box-shadow:0 4px 18px #0005}
.pn{background:linear-gradient(145deg,rgba(41,53,64,.94),rgba(26,35,44,.94));border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pn h4{background:rgba(8,15,21,.28);border-bottom:1px solid var(--line)}
.it{border:1px solid #ffffff14;border-radius:10px;overflow:hidden;background:radial-gradient(ellipse at 50% 105%,color-mix(in srgb,var(--rc) 35%,transparent),transparent 70%),linear-gradient(150deg,#37424e,#212b34);box-shadow:inset 0 -3px 0 var(--rc),0 8px 20px #0004;gap:3px}
.it img{width:100%;height:72%;min-height:0;object-fit:contain;object-position:center;filter:drop-shadow(0 8px 7px #0009);image-rendering:auto;transform:translateZ(0)}
.it small,.it i,.it b{max-width:100%;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it small{font-size:13px;line-height:1.25}.it i{font-size:11px}
.it b{font-size:13px;justify-content:center;color:#b8f2d4}
.g2 .it:hover,.g3 .it:hover{box-shadow:inset 0 -3px 0 var(--rc),0 0 23px color-mix(in srgb,var(--rc) 45%,transparent)}
.g3 .sel{outline:2px solid #7ff3b1;outline-offset:-2px}
.ok{border-radius:8px;background:linear-gradient(145deg,#1b6343,#12452f);color:#b0f7d0;border-color:#53d89b;box-shadow:0 6px 18px #0003,inset 0 0 15px #44c9871c}
.ok:hover{background:linear-gradient(145deg,#247b54,#17563a)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #9cddff;outline-offset:3px}
.bx{border:1px solid #8cc8ec33;border-radius:16px;background:linear-gradient(160deg,#303b46,#1b252f);box-shadow:0 25px 90px #000b}
.rl{border-radius:10px;border:1px solid var(--line)}
.wheel{box-shadow:0 0 0 8px #151e27,0 0 0 9px #88d8ff26,0 18px 45px #0008}
.ts{border-radius:8px;box-shadow:0 10px 35px #0008}
@media(max-width:900px){header{height:64px}.logo{font-size:19px}.c .im{padding:6px}.c .n{font-size:14px}.it img{height:67%}.pn{border-radius:10px}.wheel{margin:12px auto}.sr{top:64px}.w{padding:0 12px}.g{gap:10px}.g2{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}}
@media(max-width:420px){.logo{font-size:17px;padding-left:8px}.demo{font-size:9px}.bal{gap:4px}.c .in{padding:9px}.it small{font-size:11px}.it b{font-size:12px}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;scroll-behavior:auto!important}}

/* WERMIK — vertical upgrade, fixed upward-pointing marker */
.upgrade-panel{width:min(100%,360px);padding:15px;border:1px solid #7fd8ff33;border-radius:16px;background:linear-gradient(160deg,#222e3a,#121a24);box-shadow:0 18px 45px #0008}
.upgrade-title{display:flex;align-items:center;justify-content:space-between;gap:8px;font:700 17px Oswald;letter-spacing:1px;margin-bottom:12px}
#goldstate{font:600 10px 'Sofia Sans',sans-serif;letter-spacing:0;color:#d7b66a;text-align:right}
.vwindow{height:330px;position:relative;overflow:hidden;border-radius:13px;border:2px solid #647689;background:#232b35;box-shadow:inset 0 0 25px #000b}
.vtrack{position:absolute;inset:0 0 auto;height:6500px;background:#34424b;will-change:transform;filter:saturate(1.1)}
.vtrack:after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(to bottom,transparent 0 24px,#ffffff13 25px 26px,transparent 27px 50px);pointer-events:none}
.vpointer{position:absolute;bottom:0;left:0;right:0;height:0;z-index:3;display:flex;justify-content:center;align-items:end;filter:drop-shadow(0 0 8px #ffd54b)}
.vpointer i{position:absolute;bottom:0;width:70%;height:3px;background:#ffd447;box-shadow:0 0 12px #ffd447}
.vpointer span{position:absolute;bottom:-2px;font-size:35px;line-height:25px;color:#ffd447}
.upgrade-readout{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 4px}.upgrade-readout b{font:700 32px Oswald;color:#7debc2}.upgrade-readout small{display:block;opacity:.65;font-size:11px}.upgrade-readout #upstatus{font-size:12px;color:#a8c2d3}
.upgrade-switches{display:flex;gap:8px}.upgrade-switches button{flex:1;border:1px solid #566372;background:#303941;color:#c3c9ce;padding:10px 6px;border-radius:8px;font-size:13px}.upgrade-switches button.active{background:#e5ad26;color:#1d1c16;border-color:#ffe085;box-shadow:0 0 16px #ffc23e66;font-weight:800}
.custom-label{display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}.custom-label input{width:78px;background:#17222d;border:1px solid #7f9eb8;border-radius:6px}#applycustom{background:#365b75;border:1px solid #8ad7ff66}
.mystery-card{min-height:125px;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;background:linear-gradient(140deg,#273c51,#1b2532);border:1px solid #9ec5eb55;font-size:45px}.mystery-card small{font-size:15px}.mystery-card b{font-size:12px}
@media(max-width:900px){.upgrade-panel{width:min(100%,350px)}.vwindow{height:260px}.upgrade-switches button{font-size:12px}.ms{align-items:center}}
/* Премиальные кейсы: отличающаяся палитра и контраст */
.c:has([data-premium]){outline:1px solid #e4ae3970;background:linear-gradient(160deg,#39362b,#161b22)}
.c:has([data-premium]) .im{background:radial-gradient(circle at 50% 60%,#b9934538,transparent 75%),linear-gradient(135deg,#303846,#131b24)}
.premium-odds{padding:12px 16px;margin:16px 0;background:#2a3135;border-left:3px solid #e4ae39;color:#f6e4ad;font-size:14px}

/* WERMIK circular upgrade: fixed odds ring, rotating bottom-origin pointer */
.upgrade-panel{width:360px;max-width:100%;background:linear-gradient(160deg,#20252c,#11161c);border:1px solid #3c4651;border-radius:20px;padding:16px;box-shadow:0 16px 45px #0007}
.upgrade-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;font:700 17px Oswald;letter-spacing:1px}
#goldstate{font:600 10px 'Sofia Sans',sans-serif;color:#eac77c;letter-spacing:0;text-align:right}
.upgrade-dial{position:relative;width:min(306px,100%);aspect-ratio:1;margin:6px auto 14px;border-radius:50%;background:#11151b;box-shadow:0 0 0 5px #15191f,0 0 0 7px #353d47,0 16px 40px #000b;isolation:isolate}
.upgrade-dial::before{content:'';position:absolute;inset:4px;border-radius:50%;background:repeating-conic-gradient(from 180deg,#ffffff2c 0deg 0.65deg,transparent 0.65deg 10deg);opacity:.35}
.upgrade-ring{position:absolute;inset:18px;border-radius:50%;background:conic-gradient(from 180deg,#f6c41e 0deg,#f17c27 180deg,#252c36 180deg 360deg);box-shadow:inset 0 0 15px #0009;transition:background .2s}
